name: Build, attest and release

"on":
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: batteryguard-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  prepare:
    name: Validate version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      suffix: ${{ steps.version.outputs.suffix }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Derive version and release flag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' portable/Cargo.toml | head -n 1)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cargo.toml version must be a three-part numeric version; got '$version'"
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ "$tag" != "$version" ]]; then
              echo "::error::Tag '${GITHUB_REF_NAME}' does not match Cargo.toml version '$version'"
              exit 1
            fi
            release=true
            suffix=
          else
            release=false
            suffix="-snapshot.${GITHUB_SHA::7}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            name: Windows x64 MSI
            runner: windows-2025
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            msi_arch: x64
            test: true
          - id: windows-x86
            name: Windows x86 MSI
            runner: windows-2025
            platform: windows
            arch: x86
            target: i686-pc-windows-msvc
            msi_arch: x86
            test: true
          - id: windows-arm64
            name: Windows ARM64 MSI
            runner: windows-2025
            platform: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
            msi_arch: arm64
            test: false
          - id: linux-x64
            name: Linux x64 packages
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-musl
            test: true
          - id: linux-arm64
            name: Linux ARM64 packages
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            target: aarch64-unknown-linux-musl
            test: true
          - id: macos-x64
            name: macOS Intel PKG
            runner: macos-15-intel
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
            test: true
          - id: macos-arm64
            name: macOS Apple silicon PKG
            runner: macos-15
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
            test: true

    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_SUFFIX: ${{ needs.prepare.outputs.suffix }}
      TARGET: ${{ matrix.target }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_ARTIFACT_CONFIGURATION_BINARIES: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_BINARIES }}
      SIGNPATH_ARTIFACT_CONFIGURATION_MSI: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_MSI }}
      SIGNPATH_ARTIFACT_CONFIGURATION_ENGINE: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_ENGINE }}
      SIGNPATH_ARTIFACT_CONFIGURATION_EXE: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_EXE }}
      SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' && vars.SIGNPATH_SIGNING_POLICY_SLUG != '' && vars.SIGNPATH_ARTIFACT_CONFIGURATION_BINARIES != '' && vars.SIGNPATH_ARTIFACT_CONFIGURATION_MSI != '' && vars.SIGNPATH_ARTIFACT_CONFIGURATION_ENGINE != '' && vars.SIGNPATH_ARTIFACT_CONFIGURATION_EXE != '' }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      MACOS_APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify SignPath configuration
        if: matrix.platform == 'windows' && env.SIGNPATH_ENABLED == 'true' && env.SIGNPATH_API_TOKEN == ''
        shell: pwsh
        run: |
          throw 'SignPath variables are set but SIGNPATH_API_TOKEN is missing.'

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools rpm dpkg-dev
          target_env="$(echo "$TARGET" | tr '[:lower:]-' '[:upper:]_')"
          echo "CC_${target_env}=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${target_env}_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-D warnings -C link-arg=-Wl,--build-id=sha1" >> "$GITHUB_ENV"

      - name: Install WiX
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2
          wix --version

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path portable/Cargo.toml --release --locked --target "$TARGET"
          if [[ "${{ matrix.test }}" == "true" ]]; then
            cargo test --manifest-path portable/Cargo.toml --release --locked --target "$TARGET"
            binary="portable/target/$TARGET/release/batteryguard"
            if [[ "$TARGET" == *windows* ]]; then binary="${binary}.exe"; fi
            "$binary" --version
          fi

      - name: Build Windows tray payload
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path (Get-Location) 'battery/scripts/build.ps1')
          if ($LASTEXITCODE -ne 0) { throw "Windows tray build failed with exit code $LASTEXITCODE" }

      - name: Test Windows tray
        if: matrix.platform == 'windows' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path (Get-Location) 'battery'
          $configPath = Join-Path $root 'settings.json'
          if (-not (Test-Path -LiteralPath $configPath)) {
            $config = @{
              preset = 'Longevity'
              ceiling = 60
              resume = 55
              resumeDrop = 5
              intervalSeconds = 60
              scheduleEnabled = $false
              floatMode = $true
              schedule = @()
            } | ConvertTo-Json
            [IO.File]::WriteAllText($configPath, $config, (New-Object Text.UTF8Encoding($false)))
          }
          $uiPath = Join-Path $root 'interface.ini'
          if (-not (Test-Path -LiteralPath $uiPath)) {
            [IO.File]::WriteAllText($uiPath, "language=en`n", (New-Object Text.ASCIIEncoding))
          }
          $logPath = Join-Path $root 'application.log'
          if (-not (Test-Path -LiteralPath $logPath)) {
            [IO.File]::WriteAllText($logPath, "CI test log`n", (New-Object Text.UTF8Encoding($false)))
          }

          $tests = @(
            'Test-FloatLogic.ps1',
            'Test-ScheduleConflict.ps1',
            'Test-UiPolish.ps1',
            'Test-Settings.ps1',
            'Test-AppIdentity.ps1',
            'Test-LogRotation.ps1',
            'Test-Icons.ps1',
            'Test-Layout.ps1'
          )
          foreach ($test in $tests) {
            Write-Output "===== $test"
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path (Get-Location) "battery/tests/$test")
            if ($LASTEXITCODE -ne 0) { throw "$test failed with exit code $LASTEXITCODE" }
          }

      - name: Stage Windows binaries for SignPath
        if: matrix.platform == 'windows' && env.SIGNPATH_ENABLED == 'true' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path (Get-Location) '.signpath/binaries'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item (Join-Path (Get-Location) 'battery/application.exe') (Join-Path $stage 'application.exe') -Force
          Copy-Item (Join-Path (Get-Location) "portable/target/$env:TARGET/release/batteryguard.exe") (Join-Path $stage 'batteryguard.exe') -Force

      - name: Upload unsigned Windows binaries
        id: signpath_upload_binaries
        if: matrix.platform == 'windows' && env.SIGNPATH_ENABLED == 'true' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          name: signpath-binaries-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .signpath/binaries
          if-no-files-found: error
          retention-days: 1

      - name: Sign Windows binaries with SignPath
        id: signpath_sign_binaries
        if: matrix.platform == 'windows' && env.SIGNPATH_ENABLED == 'true' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_BINARIES }}
          github-artifact-id: ${{ steps.signpath_upload_binaries.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: "3600"
          output-artifact-directory: .signpath/binaries-signed

      - name: Install SignPath-signed Windows binaries
        if: matrix.platform == 'windows' && env.SIGNPATH_ENABLED == 'true' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signedDir = Join-Path (Get-Location) '.signpath/binaries-signed'
          $targets = @{
            'application.exe' = (Join-Path (Get-Location) 'battery/application.exe')
            'batteryguard.exe' = (Join-Path (Get-Location) "portable/target/$env:TARGET/release/batteryguard.exe")
          }
          foreach ($name in $targets.Keys) {
            $file = Get-ChildItem -LiteralPath $signedDir -Filter $name -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $file) { throw "SignPath did not return $name" }
            Copy-Item -LiteralPath $file.FullName -Destination $targets[$name] -Force
          }
          $tool = (Get-Command signtool.exe -ErrorAction SilentlyContinue | Select-Object -First 1).Source
          if (-not $tool) {
            $kit = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $tool = Get-ChildItem -Path $kit -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $tool) { throw 'signtool.exe was not found' }
          & $tool verify /pa /all @($targets.Values)
          if ($LASTEXITCODE -ne 0) { throw "SignPath binary verification failed with exit code $LASTEXITCODE" }

      - name: Sign Windows tray and CLI
        if: matrix.platform == 'windows' && env.SIGNPATH_ENABLED != 'true' && env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'batteryguard-codesign.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $tool = (Get-Command signtool.exe -ErrorAction SilentlyContinue | Select-Object -First 1).Source
            if (-not $tool) {
              $kit = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
              $tool = Get-ChildItem -Path $kit -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\x64\\' } |
                Sort-Object FullName -Descending |
                Select-Object -First 1 -ExpandProperty FullName
            }
            if (-not $tool) { throw 'signtool.exe was not found' }
            $files = @(
              (Join-Path (Get-Location) 'battery/application.exe'),
              (Join-Path (Get-Location) "portable/target/$env:TARGET/release/batteryguard.exe")
            )
            & $tool sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr 'http://timestamp.digicert.com' /td SHA256 $files
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed with exit code $LASTEXITCODE" }
            & $tool verify /pa /all $files
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed with exit code $LASTEXITCODE" }
          }
          finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Package Windows MSI
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path (Get-Location) 'packaging/windows/staging'
          $dist = Join-Path (Get-Location) 'dist'
          $locales = Join-Path $stage 'locales'
          $resources = Join-Path $stage 'resources'
          New-Item -ItemType Directory -Force -Path $stage, $dist, $locales, $resources | Out-Null
          Copy-Item 'battery/application.exe' (Join-Path $stage 'application.exe') -Force
          Copy-Item "portable/target/$env:TARGET/release/batteryguard.exe" (Join-Path $stage 'batteryguard.exe') -Force
          Copy-Item 'battery/resources/application.ico' (Join-Path $stage 'batteryguard.ico') -Force
          Copy-Item 'battery/resources/application.ico' (Join-Path $resources 'application.ico') -Force
          Copy-Item 'battery/locales/*.json' $locales -Force

          $localeWxs = Join-Path $stage 'ProductLocales.wxs'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path (Get-Location) 'packaging/windows/generate-locales.ps1') -SourceDir $stage -OutputPath $localeWxs
          if ($LASTEXITCODE -ne 0) { throw "Locale manifest generation failed with exit code $LASTEXITCODE" }

          $msi = Join-Path $dist "BatteryGuard-$env:VERSION$env:VERSION_SUFFIX-windows-${{ matrix.arch }}.msi"
          wix build -arch ${{ matrix.msi_arch }} -d "Version=$env:VERSION" -d "SourceDir=$stage" -o $msi packaging/windows/Product.wxs $localeWxs
          if ($LASTEXITCODE -ne 0) { throw "wix build failed with exit code $LASTEXITCODE" }

      - name: Sign Windows MSI
        if: matrix.platform == 'windows' && env.SIGNPATH_ENABLED != 'true' && env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'batteryguard-codesign.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $tool = (Get-Command signtool.exe -ErrorAction SilentlyContinue | Select-Object -First 1).Source
            if (-not $tool) {
              $kit = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
              $tool = Get-ChildItem -Path $kit -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\x64\\' } |
                Sort-Object FullName -Descending |
                Select-Object -First 1 -ExpandProperty FullName
            }
            if (-not $tool) { throw 'signtool.exe was not found' }
            $msi = Get-ChildItem 'dist/*.msi' | Select-Object -First 1
            if (-not $msi) { throw 'No MSI was produced' }
            & $tool sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr 'http://timestamp.digicert.com' /td SHA256 $msi.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed with exit code $LASTEXITCODE" }
            & $tool verify /pa /all $msi.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed with exit code $LASTEXITCODE" }
          }
          finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Upload unsigned Windows MSI
        id: signpath_upload_msi
        if: matrix.platform == 'windows' && env.SIGNPATH_ENABLED == 'true' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          name: signpath-msi-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*.msi
          if-no-files-found: error
          retention-days: 1

      - name: Sign Windows MSI with SignPath
        id: signpath_sign_msi
        if: matrix.platform == 'windows' && env.SIGNPATH_ENABLED == 'true' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_MSI }}
          github-artifact-id: ${{ steps.signpath_upload_msi.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: "3600"
          output-artifact-directory: .signpath/msi-signed

      - name: Install SignPath-signed Windows MSI
        if: matrix.platform == 'windows' && env.SIGNPATH_ENABLED == 'true' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signedDir = Join-Path (Get-Location) '.signpath/msi-signed'
          $signedMsi = Get-ChildItem -LiteralPath $signedDir -Filter '*.msi' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $signedMsi) { throw 'SignPath did not return the MSI' }
          $msi = Get-ChildItem 'dist/*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'No MSI was produced' }
          Copy-Item -LiteralPath $signedMsi.FullName -Destination $msi.FullName -Force
          $tool = (Get-Command signtool.exe -ErrorAction SilentlyContinue | Select-Object -First 1).Source
          if (-not $tool) {
            $kit = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $tool = Get-ChildItem -Path $kit -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $tool) { throw 'signtool.exe was not found' }
          & $tool verify /pa /all $msi.FullName
          if ($LASTEXITCODE -ne 0) { throw "SignPath MSI verification failed with exit code $LASTEXITCODE" }

      - name: Package Windows EXE
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path (Get-Location) 'dist'
          $msi = Get-ChildItem 'dist/*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'No MSI was produced for the EXE bundle' }
          $icon = Join-Path (Get-Location) 'battery/resources/application.ico'
          if (-not (Test-Path -LiteralPath $icon)) { throw "Missing bundle icon: $icon" }
          $bundle = Join-Path $dist "BatteryGuard-$env:VERSION$env:VERSION_SUFFIX-windows-${{ matrix.arch }}.exe"
          wix build -arch ${{ matrix.msi_arch }} -ext WixToolset.BootstrapperApplications.wixext `
            -d "Version=$env:VERSION" -d "MsiPath=$($msi.FullName)" -d "IconPath=$icon" `
            -o $bundle packaging/windows/Bundle.wxs
          if ($LASTEXITCODE -ne 0) { throw "wix bundle build failed with exit code $LASTEXITCODE" }

      - name: Prepare Burn engine for SignPath
        if: matrix.platform == 'windows' && env.SIGNPATH_ENABLED == 'true' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path (Get-Location) '.signpath/engine'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $bundle = Get-ChildItem 'dist/*.exe' | Select-Object -First 1
          if (-not $bundle) { throw 'No EXE bundle was produced' }
          wix burn detach $bundle.FullName -engine (Join-Path $stage 'burn-engine.exe')
          if ($LASTEXITCODE -ne 0) { throw "wix burn detach failed with exit code $LASTEXITCODE" }

      - name: Upload unsigned Burn engine
        id: signpath_upload_engine
        if: matrix.platform == 'windows' && env.SIGNPATH_ENABLED == 'true' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          name: signpath-engine-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .signpath/engine
          if-no-files-found: error
          retention-days: 1

      - name: Sign Burn engine with SignPath
        id: signpath_sign_engine
        if: matrix.platform == 'windows' && env.SIGNPATH_ENABLED == 'true' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_ENGINE }}
          github-artifact-id: ${{ steps.signpath_upload_engine.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: "3600"
          output-artifact-directory: .signpath/engine-signed

      - name: Reattach SignPath-signed Burn engine
        if: matrix.platform == 'windows' && env.SIGNPATH_ENABLED == 'true' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signedDir = Join-Path (Get-Location) '.signpath/engine-signed'
          $signedEngine = Get-ChildItem -LiteralPath $signedDir -Filter burn-engine.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $signedEngine) { throw 'SignPath did not return burn-engine.exe' }
          $bundle = Get-ChildItem 'dist/*.exe' | Select-Object -First 1
          $engine = Join-Path (Get-Location) '.signpath/engine/burn-engine.exe'
          $reattached = Join-Path (Get-Location) '.signpath/bundle-reattached.exe'
          Copy-Item -LiteralPath $signedEngine.FullName -Destination $engine -Force
          wix burn reattach $bundle.FullName -engine $engine -o $reattached
          if ($LASTEXITCODE -ne 0) { throw "wix burn reattach failed with exit code $LASTEXITCODE" }
          Move-Item -LiteralPath $reattached -Destination $bundle.FullName -Force
          $tool = (Get-Command signtool.exe -ErrorAction SilentlyContinue | Select-Object -First 1).Source
          if (-not $tool) {
            $kit = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $tool = Get-ChildItem -Path $kit -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $tool) { throw 'signtool.exe was not found' }
          & $tool verify /pa /all $engine
          if ($LASTEXITCODE -ne 0) { throw "SignPath engine verification failed with exit code $LASTEXITCODE" }

      - name: Stage Windows EXE for SignPath
        if: matrix.platform == 'windows' && env.SIGNPATH_ENABLED == 'true' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path (Get-Location) '.signpath/exe'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-ChildItem 'dist/*.exe' | Copy-Item -Destination $stage -Force

      - name: Upload unsigned Windows EXE
        id: signpath_upload_exe
        if: matrix.platform == 'windows' && env.SIGNPATH_ENABLED == 'true' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          name: signpath-exe-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .signpath/exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign Windows EXE with SignPath
        id: signpath_sign_exe
        if: matrix.platform == 'windows' && env.SIGNPATH_ENABLED == 'true' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_EXE }}
          github-artifact-id: ${{ steps.signpath_upload_exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: "3600"
          output-artifact-directory: .signpath/exe-signed

      - name: Install SignPath-signed Windows EXE
        if: matrix.platform == 'windows' && env.SIGNPATH_ENABLED == 'true' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signedDir = Join-Path (Get-Location) '.signpath/exe-signed'
          $signedExe = Get-ChildItem -LiteralPath $signedDir -Filter '*.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $signedExe) { throw 'SignPath did not return the EXE' }
          $bundle = Get-ChildItem 'dist/*.exe' | Select-Object -First 1
          if (-not $bundle) { throw 'No EXE bundle was produced' }
          Copy-Item -LiteralPath $signedExe.FullName -Destination $bundle.FullName -Force
          $tool = (Get-Command signtool.exe -ErrorAction SilentlyContinue | Select-Object -First 1).Source
          if (-not $tool) {
            $kit = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $tool = Get-ChildItem -Path $kit -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $tool) { throw 'signtool.exe was not found' }
          & $tool verify /pa /all $bundle.FullName
          if ($LASTEXITCODE -ne 0) { throw "SignPath EXE verification failed with exit code $LASTEXITCODE" }

      - name: Sign Windows EXE
        if: matrix.platform == 'windows' && env.SIGNPATH_ENABLED != 'true' && env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'batteryguard-codesign.pfx'
          $engine = Join-Path $env:RUNNER_TEMP 'batteryguard-burn-engine.exe'
          $reattached = Join-Path $env:RUNNER_TEMP 'batteryguard-bundle-reattached.exe'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $tool = (Get-Command signtool.exe -ErrorAction SilentlyContinue | Select-Object -First 1).Source
            if (-not $tool) {
              $kit = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
              $tool = Get-ChildItem -Path $kit -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\x64\\' } |
                Sort-Object FullName -Descending |
                Select-Object -First 1 -ExpandProperty FullName
            }
            if (-not $tool) { throw 'signtool.exe was not found' }
            $bundle = Get-ChildItem 'dist/*.exe' | Select-Object -First 1
            if (-not $bundle) { throw 'No EXE bundle was produced' }

            wix burn detach $bundle.FullName -engine $engine
            if ($LASTEXITCODE -ne 0) { throw "wix burn detach failed with exit code $LASTEXITCODE" }
            & $tool sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr 'http://timestamp.digicert.com' /td SHA256 $engine
            if ($LASTEXITCODE -ne 0) { throw "Burn engine signing failed with exit code $LASTEXITCODE" }
            wix burn reattach $bundle.FullName -engine $engine -o $reattached
            if ($LASTEXITCODE -ne 0) { throw "wix burn reattach failed with exit code $LASTEXITCODE" }
            Move-Item -LiteralPath $reattached -Destination $bundle.FullName -Force
            & $tool sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr 'http://timestamp.digicert.com' /td SHA256 $bundle.FullName
            if ($LASTEXITCODE -ne 0) { throw "Bundle signing failed with exit code $LASTEXITCODE" }
            & $tool verify /pa /all $bundle.FullName
            if ($LASTEXITCODE -ne 0) { throw "Bundle signature verification failed with exit code $LASTEXITCODE" }
          }
          finally {
            Remove-Item -LiteralPath $pfx, $engine, $reattached -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke-test Windows MSI
        if: matrix.platform == 'windows' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem 'dist/*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'No MSI was produced' }
          $installLog = Join-Path $env:RUNNER_TEMP 'batteryguard-install.log'
          $install = Start-Process -FilePath msiexec.exe -ArgumentList @('/i', ('"' + $msi.FullName + '"'), '/qn', '/norestart', '/l*v', ('"' + $installLog + '"')) -Wait -PassThru
          if ($install.ExitCode -ne 0) {
              Get-Content $installLog -Tail 80 -ErrorAction SilentlyContinue
              throw "MSI install failed with exit code $($install.ExitCode)"
          }

          $installDir = Join-Path ${env:ProgramFiles} 'BatteryGuard'
          $expected = @('application.exe', 'batteryguard.exe', 'resources\application.ico', 'locales\ar.json', 'locales\zh-CN.json')
          foreach ($relative in $expected) {
              $path = Join-Path $installDir $relative
              if (-not (Test-Path -LiteralPath $path)) { throw "Missing installed payload: $path" }
          }

          $shortcut = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\BatteryGuard\BatteryGuard.lnk'
          if (-not (Test-Path -LiteralPath $shortcut)) { throw "Missing Start Menu shortcut: $shortcut" }
          $shell = New-Object -ComObject WScript.Shell
          $link = $shell.CreateShortcut($shortcut)
          if ($link.TargetPath -notlike '*application.exe') { throw "Shortcut target is wrong: $($link.TargetPath)" }

          $uninstall = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\BatteryGuard\Uninstall BatteryGuard.lnk'
          if (-not (Test-Path -LiteralPath $uninstall)) { throw "Missing uninstall shortcut: $uninstall" }

          $remove = Start-Process -FilePath msiexec.exe -ArgumentList @('/x', ('"' + $msi.FullName + '"'), '/qn', '/norestart') -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "MSI uninstall failed with exit code $($remove.ExitCode)" }
          if (Test-Path -LiteralPath $installDir) { throw "Install directory remains after uninstall: $installDir" }

      - name: Smoke-test Windows EXE
        if: matrix.platform == 'windows' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Get-ChildItem 'dist/*.exe' | Select-Object -First 1
          if (-not $bundle) { throw 'No EXE bundle was produced' }
          $installLog = Join-Path $env:RUNNER_TEMP 'batteryguard-bundle-install.log'
          $removeLog = Join-Path $env:RUNNER_TEMP 'batteryguard-bundle-uninstall.log'
          $install = Start-Process -FilePath $bundle.FullName -ArgumentList @('/install', '/quiet', '/norestart', '/log', ('"' + $installLog + '"')) -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) {
              Get-Content $installLog -Tail 100 -ErrorAction SilentlyContinue
              throw "EXE bundle install failed with exit code $($install.ExitCode)"
          }

          $installDir = Join-Path ${env:ProgramFiles} 'BatteryGuard'
          foreach ($relative in @('application.exe', 'batteryguard.exe', 'resources\application.ico', 'locales\ar.json', 'locales\zh-CN.json')) {
              $path = Join-Path $installDir $relative
              if (-not (Test-Path -LiteralPath $path)) { throw "Missing EXE-installed payload: $path" }
          }
          $shortcut = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\BatteryGuard\BatteryGuard.lnk'
          if (-not (Test-Path -LiteralPath $shortcut)) { throw "Missing EXE Start Menu shortcut: $shortcut" }

          $remove = Start-Process -FilePath $bundle.FullName -ArgumentList @('/uninstall', '/quiet', '/norestart', '/log', ('"' + $removeLog + '"')) -Wait -PassThru
          if ($remove.ExitCode -notin @(0, 3010)) {
              Get-Content $removeLog -Tail 100 -ErrorAction SilentlyContinue
              throw "EXE bundle uninstall failed with exit code $($remove.ExitCode)"
          }
          if (Test-Path -LiteralPath $installDir) { throw "Install directory remains after EXE uninstall: $installDir" }

      - name: Test Windows v0.1.0 upgrade
        if: matrix.platform == 'windows' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Get-ChildItem 'dist/*.exe' | Select-Object -First 1
          if (-not $bundle) { throw 'No EXE bundle was produced' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path (Get-Location) 'packaging/windows/Test-WindowsUpgrade.ps1') -Bundle $bundle.FullName
          if ($LASTEXITCODE -ne 0) { throw "Windows v0.1.0 upgrade test failed with exit code $LASTEXITCODE" }

      - name: Package Linux DEB, RPM and AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          bash packaging/linux/build-linux.sh \
            "portable/target/$TARGET/release/batteryguard" \
            "$VERSION" "$VERSION_SUFFIX" "${{ matrix.arch }}" "dist"

      - name: Package macOS PKG
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          binary="portable/target/$TARGET/release/batteryguard"

          if [ -z "${MACOS_CERTIFICATE_P12_BASE64:-}" ]; then
            bash packaging/macos/build-pkg.sh "$binary" "$VERSION" "$VERSION_SUFFIX" "${{ matrix.arch }}" "dist"
            echo "::notice::MACOS_CERTIFICATE_P12_BASE64 is not set; the PKG is unsigned."
            exit 0
          fi

          for name in MACOS_CERTIFICATE_PASSWORD MACOS_KEYCHAIN_PASSWORD \
            MACOS_APPLICATION_IDENTITY MACOS_INSTALLER_IDENTITY \
            MACOS_NOTARY_APPLE_ID MACOS_NOTARY_TEAM_ID MACOS_NOTARY_PASSWORD; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              echo "::error::$name must be set when macOS signing is enabled."
              exit 1
            fi
          done

          keychain="$RUNNER_TEMP/batteryguard-signing.keychain-db"
          cert="$RUNNER_TEMP/batteryguard-signing.p12"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -f "$cert"
          }
          trap cleanup EXIT

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security default-keychain -s "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$cert"
          security import "$cert" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain" >/dev/null

          codesign --force --options runtime --timestamp \
            --sign "$MACOS_APPLICATION_IDENTITY" "$binary"
          codesign --verify --strict --verbose=2 "$binary"

          bash packaging/macos/build-pkg.sh "$binary" "$VERSION" "$VERSION_SUFFIX" "${{ matrix.arch }}" "dist"
          pkg="$(find dist -maxdepth 1 -name '*.pkg' -print -quit)"
          if [ -z "$pkg" ]; then
            echo "::error::No macOS PKG was produced"
            exit 1
          fi

          signed="$RUNNER_TEMP/BatteryGuard-notarized.pkg"
          productsign --sign "$MACOS_INSTALLER_IDENTITY" "$pkg" "$signed"
          xcrun notarytool submit "$signed" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD" --wait
          xcrun stapler staple "$signed"
          xcrun stapler validate "$signed"
          pkgutil --check-signature "$signed"
          mv "$signed" "$pkg"
          echo "signed and notarized $pkg"

      - name: Smoke-test native package
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            linux)
              deb="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
              rpm="$(find dist -maxdepth 1 -name '*.rpm' -print -quit)"
              appimage="$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)"
              [ -n "$deb" ] && [ -n "$rpm" ] && [ -n "$appimage" ]
              rpm -qip "$rpm" >/dev/null
              sudo dpkg -i "$deb"
              batteryguard --version
              APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version
              sudo dpkg -r batteryguard
              ;;
            macos)
              pkg="$(find dist -maxdepth 1 -name '*.pkg' -print -quit)"
              [ -n "$pkg" ]
              sudo installer -pkg "$pkg" -target /
              /usr/local/bin/batteryguard --version
              ;;
          esac

      - name: Keep only installer payload
        shell: bash
        run: |
          set -euo pipefail
          # WiX also emits a .wixpdb. Keep the uploaded and attested payload to
          # the exact release allowlist instead of carrying debug metadata.
          find dist -maxdepth 1 -type f \
            ! -name '*.msi' \
            ! -name '*.exe' \
            ! -name '*.deb' \
            ! -name '*.rpm' \
            ! -name '*.AppImage' \
            ! -name '*.pkg' \
            -delete

      - name: List installer payload
        shell: bash
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -exec basename {} \; | sort

      - name: Sign with GitHub artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: needs.prepare.outputs.release == 'true'
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download every installer
        uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: release
          merge-multiple: true

      - name: Verify clean release payload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/*)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No installer files were produced"
            exit 1
          fi
          for file in "${files[@]}"; do
            case "$file" in
              *.msi|*.exe|*.deb|*.rpm|*.AppImage|*.pkg) ;;
              *)
                echo "::error::Unexpected non-installer release asset: $file"
                exit 1
                ;;
            esac
          done
          find release -maxdepth 1 -type f -exec basename {} \; | sort

      - name: Create release from tag
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: BatteryGuard ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            BatteryGuard ${{ needs.prepare.outputs.version }}

            Installers are attached only as platform-native packages:
            `.exe` or `.msi` for Windows, `.deb`/`.rpm`/`.AppImage` for Linux, and `.pkg` for macOS.

            Every installer is covered by a GitHub/Sigstore build-provenance
            attestation from this workflow run.
